services:
  crawl4ai-api:
    build: .
    image: crawl4ai-service:latest
    container_name: crawl4ai-api
    ports:
      # Only reachable from this machine; use "8000:8000" to expose it to the network (set API_KEY then).
      - "127.0.0.1:8000:8000"
    environment:
      MAX_CONCURRENCY: "2"
      PAGE_TIMEOUT_MS: "60000"
      REQUEST_TIMEOUT_S: "120"
      API_KEY: "${API_KEY:-}"
      # Local default: open /parse without a key. Set ALLOW_INSECURE=false and API_KEY=... for safer setups.
      ALLOW_INSECURE: "${ALLOW_INSECURE:-true}"
      ALLOW_PRIVATE_URLS: "false"
      LOG_LEVEL: "INFO"
      CRAWL4AI_NO_CLOUD_NOTICE: "1"
    init: true
    mem_limit: 2g
    cpus: "1.0"
    shm_size: "512m"
    # Chromium/Playwright needs basic process capabilities; dropping ALL caps hangs browser startup.
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      # Ready only when Chromium is up — "starting"/"error" keep the container unhealthy.
      test: ["CMD", "python", "-c", "import json,sys,urllib.request; r=json.load(urllib.request.urlopen('http://localhost:8000/health', timeout=5)); sys.exit(0 if r.get('browser') == 'ready' else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
